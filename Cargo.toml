[package]
name = "forgecrypt"
version = "1.2.0"
edition = "2024"
rust-version = "1.85"
description = "A Linux-first authenticated encryption utility with verify and re-key support"
license = "MIT"
repository = "https://github.com/abduforge/forgecrypt"
readme = "README.md"

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
rpassword = "7.5.4"
zeroize = "1.9.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
