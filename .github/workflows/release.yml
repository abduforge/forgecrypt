name: Build Linux release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    name: Build Linux x86_64 release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -n 1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG_VERSION" || {
            echo "Tag $TAG_VERSION does not match Cargo.toml version $VERSION" >&2
            exit 1
          }
      - name: Run tests and build
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo build --release
      - name: Package binary and installation helpers
        run: |
          mkdir -p dist/forgecrypt
          install -m 0755 target/release/forgecrypt dist/forgecrypt/forgecrypt
          install -m 0755 install.sh dist/forgecrypt/install.sh
          install -m 0755 uninstall.sh dist/forgecrypt/uninstall.sh
          cp README.md README_RU.md SECURITY.md LICENSE dist/forgecrypt/
          tar -C dist -czf "dist/forgecrypt-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" forgecrypt
          cd dist
          sha256sum "forgecrypt-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" > "forgecrypt-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz.sha256"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ForgeCrypt ${{ github.ref_name }} GLOBAL
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
